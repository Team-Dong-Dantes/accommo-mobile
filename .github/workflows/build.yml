name: Build & Release

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'   # @quasar/app-vite requires >= 22.22

jobs:
  # 1. Validate: install + web build (dev/feature checks; guards regressions)
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck || true
      - name: Build web assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_DEMO_MODE: ''
        run: npm run build

  # 2. Build Android APK (main only)
  build-android:
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      version_name: ${{ steps.version.outputs.name }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'   # Android compileSdk 36 / capacitor needs Java 21 (not 17)
      - name: Install dependencies
        run: npm ci
      # major.minor is whatever package.json says — bump it there when you ship
      # a change (patch for a fix, minor for a feature). The run number is
      # appended so two builds can never carry the same name even if the bump
      # is forgotten, and the versionCode stays the bare run number.
      - name: Resolve version
        id: version
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          NAME="$BASE.${{ github.run_number }}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "ACCOMMO_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "ACCOMMO_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Building $NAME (versionCode ${{ github.run_number }})"
      - name: Build web assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_DEMO_MODE: ''
        run: npm run build
      # Cap sync must run inside src-capacitor, where the native android project
      # and this project's capacitor.config.json (webDir "www") live.
      - name: Stage web into Capacitor www
        run: |
          mkdir -p src-capacitor/www
          cp -r dist/spa/* src-capacitor/www/
      - name: Sync Capacitor Android
        run: |
          cd src-capacitor
          node ../node_modules/@capacitor/cli/bin/capacitor sync android
      # Optional signing — signs only when the keystore secret is present.
      # (The secrets context can't be used in a step `if:`; guard it in bash.)
      - name: Decode keystore (if configured)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No keystore configured — building unsigned APK"; exit 0; fi
          mkdir -p src-capacitor/android/app
          echo "$KEYSTORE_BASE64" | base64 -d > src-capacitor/android/app/release.jks
          {
            echo 'storeFile=release.jks'
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > src-capacitor/android/app/keystore.properties
      # ACCOMMO_VERSION_CODE / ACCOMMO_VERSION_NAME come from the Resolve version
      # step above, via GITHUB_ENV.
      - name: Build Android release
        run: |
          cd src-capacitor/android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: src-capacitor/android/app/build/outputs/apk/release/*.apk

  # 3. Publish a GitHub Release with the APK (main only)
  release:
    runs-on: ubuntu-latest
    needs: build-android
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/**/*.apk
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            Auto-generated Android build from CI.
            Ref: ${{ github.sha }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Publishing the release is only half of it — without this step nothing
      # installed hears that a new build exists. Guarded in bash because the
      # secrets context can't be used in a step `if:`, same as the keystore step
      # above: a missing secret warns and moves on rather than failing a release
      # that has already succeeded.
      - name: Announce release to Supabase
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ needs.build-android.outputs.version_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY not set — installed apps will not be told about this release"
            exit 0
          fi
          # min_supported_version_code is deliberately not touched here. Cutting
          # old builds off is a manual decision, never a side effect of shipping.
          curl -fsS -X PATCH "$SUPABASE_URL/rest/v1/app_release?id=eq.1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"latest_version_code\":$VERSION_CODE,\"latest_version_name\":\"$VERSION_NAME\",\"apk_url\":\"https://github.com/$REPO/releases/latest/download/app-release.apk\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"
          echo "Announced version code $VERSION_CODE"
