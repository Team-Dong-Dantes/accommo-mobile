<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8">
    <meta name="description" content="<%= productDescription %>">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: https://*.supabase.co wss://*.supabase.co https://api.mapbox.com https://*.mapbox.com https://events.mapbox.com https://fonts.openmaptiles.org https://api.cloudinary.com https://res.cloudinary.com; img-src 'self' data: blob: https://*.supabase.co https://www.gstatic.com https://lh3.googleusercontent.com https://api.mapbox.com https://*.mapbox.com https://*.tiles.mapbox.com https://fonts.openmaptiles.org https://api.cloudinary.com https://res.cloudinary.com; font-src 'self' data: https://api.mapbox.com https://fonts.openmaptiles.org; worker-src 'self' blob:; form-action 'self'; base-uri 'self';<% if (!ctx.dev) { %> upgrade-insecure-requests;<% } %>"
    />

    <!-- Browser tab only. The Android WebView re-fetches and re-renders the
         favicon on every in-app navigation, so the app gets none — the old
         136 KB logo.svg froze the UI ~450 ms per page change. -->
    <% if (!ctx.mode.capacitor) { %><link rel="icon" type="image/svg+xml" href="accommo-logo.svg"><% } %>

    <!-- Nothing in <head> may load from the network: it holds the first paint
         until it arrives. Mapbox and the fonts are bundled instead (see
         src/utils/mapbox.ts and src/boot/fonts.ts). -->
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
